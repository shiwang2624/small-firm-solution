<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'; frame-src 'self' blob:" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2454D8" />
  <meta name="description" content="SmallFirm Solution — billing, invoicing, inventory and GST-ready accounting for small businesses. Works offline." />
  <title>SmallFirm Solution</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="brand/icon-192.png" />
  <link rel="icon" href="brand/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- ============ branded sidebar ============ -->
    <aside class="sidebar">
      <div class="brand">
        <img class="brand-logo" src="brand/mark.png" alt="SmallFirm" />
        <div class="brand-text">
          <strong>SmallFirm</strong>
          <span>Solution</span>
        </div>
      </div>

      <div class="sb-search">
        <span class="ico" id="sb-search-ico"></span>
        <input id="sb-search" placeholder="Open Anything (⌘F)" autocomplete="off" />
      </div>

      <nav id="nav" class="nav"></nav>

      <div class="sb-bottom">
        <div class="promo" id="promo-card">
          <div class="promo-title" id="promo-title">Keep your books safe</div>
          <div class="promo-sub" id="promo-sub">Back up all firms to a file</div>
          <button class="promo-btn" id="promo-btn">Backup now →</button>
        </div>
        <button class="firm-switch" id="firm-picker">
          <span class="avatar" id="firm-avatar">S</span>
          <span class="firm-name" id="firm-picker-label">My Firm</span>
          <span class="chev">›</span>
        </button>
      </div>
    </aside>

    <!-- ============ light content ============ -->
    <main class="content">
      <div class="support-strip">
        <span class="muted">Need a hand?</span>
        <a class="link" id="help-link">Get instant help</a>
        <span class="dot">·</span>
        <a class="link" id="legal-terms">Terms</a>
        <span class="dot">·</span>
        <a class="link" id="legal-privacy">Privacy</a>
        <span class="dot">·</span>
        <a class="link" id="strip-search">Search everything (⌘K)</a>
      </div>

      <header class="topbar">
        <div class="tb-search">
          <span class="ico" id="tb-search-ico"></span>
          <input id="tb-search" placeholder="Search transactions" autocomplete="off" />
        </div>
        <div class="tb-actions">
          <button class="soft brand" id="tb-sale"></button>
          <button class="soft accent" id="tb-purchase"></button>
          <button class="soft blue sq" id="tb-plus" title="Create something new"></button>
          <button class="icon-btn" id="tb-more" title="More"></button>
        </div>
      </header>

      <div class="page-head">
        <div class="ph-left">
          <h1 id="view-title">Dashboard</h1>
          <p id="view-sub" class="sub"></p>
        </div>
        <div class="page-actions" id="topbar-actions"></div>
      </div>

      <section id="view" class="view"></section>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="palette-root"></div>
  <div id="toast" class="toast hidden"></div>

  <script src="vendor/qrcode.js"></script>
  <script src="vendor/jsbarcode.min.js"></script>
  <script src="vendor/zxing.min.js"></script>
  <script src="js/web-api.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/util.js"></script>
  <script src="js/store.js"></script>
  <script src="js/views-main.js"></script>
  <script src="js/views-money.js"></script>
  <script src="js/views-reports.js"></script>
  <script src="js/views-settings.js"></script>
  <script src="js/views-editors.js"></script>
  <script src="js/views-pos.js"></script>
  <script src="js/views-utilities.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
